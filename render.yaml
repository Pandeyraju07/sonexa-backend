services:
  - type: web
    name: sonexa-backend
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SONEXA_MEDIA_PUBLIC_BASE_URL
        value: https://sonexa-backend.onrender.com
      - key: SONEXA_CORS_ORIGINS
        value: https://zynera.app,https://www.zynera.app
