server.port=8080

# Application Name
spring.application.name=sonexa-backend

# MySQL Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/sonexa_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Local SMTP credentials (sender account only). Recipient is always the user's email.
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# Gmail SMTP sender â€” set via env or application-local.properties (do NOT hardcode secrets here)
sonexa.mail.enabled=true
sonexa.mail.require-delivery=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SONEXA_MAIL_USERNAME:${GMAIL_USERNAME:}}
spring.mail.password=${SONEXA_MAIL_PASSWORD:${GMAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# JWT Configuration
jwt.secret=sonexa_super_secret_jwt_key_2026_industry_level_security_token_key

# Media uploads (audio + covers)
sonexa.media.upload-dir=uploads
sonexa.media.public-base-url=http://192.168.1.7:8080
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
# Lyrics providers (Spotify-style metadata match â†’ synced lines)
# Default: free LRCLIB. Optional Musixmatch key for licensed plain lyrics.
sonexa.lyrics.musixmatch-apikey=${SONEXA_MUSIXMATCH_APIKEY:}

# YouTube API Integration (Data API v3)
youtube.api.key=${YOUTUBE_API_KEY:}
sonexa.youtube.enabled=true