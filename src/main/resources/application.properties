server.port=${SERVER_PORT:8080}

# Application Name
spring.application.name=sonexa-backend

# MySQL Datasource — override via environment in production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sonexa_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# Local default matches the previous MySQL root password. Override via SPRING_DATASOURCE_PASSWORD.
# Production profile requires SPRING_DATASOURCE_PASSWORD and does not use this default.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${SONEXA_DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=${SONEXA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local SMTP credentials (sender account only). Recipient is always the user's email.
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# Gmail SMTP sender — set via env or application-local.properties (do NOT hardcode secrets here)
sonexa.mail.enabled=true
sonexa.mail.require-delivery=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SONEXA_MAIL_USERNAME:${GMAIL_USERNAME:}}
spring.mail.password=${SONEXA_MAIL_PASSWORD:${GMAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# JWT — MUST be overridden in production via JWT_SECRET (32+ bytes)
jwt.secret=${JWT_SECRET:}

# Media uploads (audio + covers)
sonexa.media.upload-dir=${SONEXA_MEDIA_UPLOAD_DIR:uploads}
sonexa.media.public-base-url=${SONEXA_MEDIA_PUBLIC_BASE_URL:http://localhost:8080}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Lyrics providers
sonexa.lyrics.musixmatch-apikey=${SONEXA_MUSIXMATCH_APIKEY:}

# YouTube API Integration (Data API v3)
youtube.api.key=${YOUTUBE_API_KEY:}
sonexa.youtube.enabled=${SONEXA_YOUTUBE_ENABLED:true}

# CORS
sonexa.cors.allowed-origins=${SONEXA_CORS_ORIGINS:http://localhost:*,http://10.0.2.2:*,https://zynera.app,https://www.zynera.app,https://sonexa.app,https://www.sonexa.app}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n
