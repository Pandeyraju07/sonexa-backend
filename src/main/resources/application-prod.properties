spring.application.name=sonexa-backend

# Production profile: spring.profiles.active=prod
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# These MUST be provided by the environment. The process will fail closed if JWT_SECRET is missing/weak.
jwt.secret=${JWT_SECRET}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

sonexa.media.public-base-url=${SONEXA_MEDIA_PUBLIC_BASE_URL}
sonexa.cors.allowed-origins=${SONEXA_CORS_ORIGINS:https://zynera.app,https://www.zynera.app,https://sonexa.app,https://www.sonexa.app}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
