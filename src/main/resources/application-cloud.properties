# Render / PaaS profile: boot without an external MySQL.
# Override with SPRING_PROFILES_ACTIVE=prod plus SPRING_DATASOURCE_* for a real database.
spring.datasource.url=jdbc:h2:file:/tmp/zynera;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:}
sonexa.media.public-base-url=${SONEXA_MEDIA_PUBLIC_BASE_URL:https://zynera-backend.onrender.com}
sonexa.cors.allowed-origins=${SONEXA_CORS_ORIGINS:https://zynera.app,https://www.zynera.app,https://zynera-backend.onrender.com}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
